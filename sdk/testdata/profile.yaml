# A complete profile. Budgets are schema only for now.
schema: v0
id: coding-default
version: "3"
required_features: [control.pause, control.stop, activity.v0]
limits:
  max_workers: 2
  max_tool_concurrency: 4
  max_subagent_depth: 1
  max_subagents: 3
default_pause_mode: interrupt
stop_grace: 45s
budgets:
  - kind: time
    limit: 3600
    alert_at_percent: 80
    on_exhaust: wait
    wait_mode: pause
  - kind: money
    limit: 12.5
    currency: EUR
    on_exhaust: kill
models:
  aliases:
    - alias: large
      description: the strongest model available
      capabilities: [tools, vision]
    - alias: fast
  roles:
    main: large
    subagent: fast
    llm: fast
  selectable: [fast, large]
tools:
  - name: shell
  - name: decide
    settings:
      route: humans
instructions: |
  Write the report in British English.
tools_manifest: |
  jq and ripgrep are installed.
checkpoint_every_turns: 2

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags for `git describe` in the build version

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up tools
        run: make setup

      - name: Check
        run: make check

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Cross-build
        run: make dist

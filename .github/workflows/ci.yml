name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set up tools
        run: make setup
      - name: Check
        run: make check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Race detector and fuzz smoke runs on Linux and macOS.
      - name: Test
        if: runner.os != 'Windows'
        run: make test
      # Windows runs the tests without the race detector; those that need
      # POSIX signals are built for Unix only, and say why.
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Build
        run: go build ./...

  dist:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history and tags for `git describe` in the build version
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build all platforms
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: actlet-binaries
          path: dist/
          if-no-files-found: error

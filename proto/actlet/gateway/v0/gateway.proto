// Actlet gateway protocol, version 0.
//
// An Actlet worker connects out to one gateway address served by the
// orchestrator. It registers, then keeps two independent streams open: one
// for control commands and one for activity events, so that slow activity
// never delays control.
//
// EXPERIMENTAL (v0): messages may change incompatibly until v1.

syntax = "proto3";

package actlet.gateway.v0;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/actlet/actlet/proto/actlet/gateway/v0;gatewayv0";

// Gateway is served by the orchestrator and called by Actlet workers.
// Workers authenticate with an "authorization: Bearer <token>" metadata
// entry on every call.
service Gateway {
  // Register attaches a worker to a session: a new one when session_id is
  // empty, or an existing one when a worker resumes.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Control carries commands to the worker and acknowledgements and status
  // back. The worker's first message is a ControlHello.
  rpc Control(stream ControlUp) returns (stream ControlDown);

  // PublishActivity carries activity events to the gateway. The worker's
  // first message is an ActivityHello; the gateway answers with an
  // ActivityAck of what it already has, and the worker sends from there.
  rpc PublishActivity(stream ActivityUp) returns (stream ActivityAck);

  // Infer makes one model call for a session's agent: the worker sends the
  // conversation, and the gateway streams the model's answer. The gateway
  // resolves the model alias to a provider and model of its choosing; the
  // worker never sees providers or credentials.
  rpc Infer(InferenceRequest) returns (stream InferenceResponse);

  // CallTool runs a bridged tool for a session's agent: a tool the
  // orchestrator implements, such as "decide". The intent ID is an
  // idempotency key, as for Infer. The call may wait a long time, such as
  // for a person to decide.
  rpc CallTool(ToolCallRequest) returns (ToolCallResponse);
}

// --- Registration ---

message RegisterRequest {
  // Protocol version the worker speaks: "v0".
  string protocol_version = 1;
  // Stable identity of the worker instance, e.g. a host or Pod name.
  string worker_id = 2;
  // Empty for a new session; the session's ID when resuming.
  string session_id = 3;
  // Run number of this session on the worker, starting at 1 and increasing
  // with every start of the process. Activity is sequenced per epoch.
  uint64 epoch = 4;
  // Features the worker supports.
  repeated string capabilities = 5;
  // Version of the Actlet binary, for diagnostics.
  string actlet_version = 6;
}

message RegisterResponse {
  string session_id = 1;
  Profile profile = 2;
  // The task to run. Optional when the session folder already holds one.
  Task task = 3;
}

// Profile selects the worker's behaviour within the ceilings its deployment
// configuration sets.
message Profile {
  string id = 1;
  string version = 2;
  Limits limits = 3;
  // Mode used when the worker is asked to pause by an OS signal instead of
  // a command. Unspecified means drain.
  PauseMode default_pause_mode = 4;
  // Grace period for stop commands that don't give one.
  google.protobuf.Duration stop_grace = 5;
  DisconnectBehavior on_disconnect = 6;
  // Features a worker must support to honour this profile, as named in
  // RegisterRequest.capabilities. A worker that lacks any refuses the
  // profile, and the gateway should not assign it to such a worker.
  repeated string required_features = 7;
  // Budgets limit the session's use of time, money, tokens and disk.
  repeated Budget budgets = 8;
  // The models the session may use, by alias. Workers never see provider
  // names or credentials. The agent uses the alias of the "main" role.
  ModelCatalog models = 9;
  // The tools the session may use, with their settings. Empty allows all
  // the local tools with default settings. The standard tools
  // (report_progress, send_feedback, budget_status, decide and llm) are
  // offered only when granted by name.
  repeated ToolGrant tools = 10;
  // The implementor's instructions to the agent, added to Actlet's base
  // prompt.
  string instructions = 11;
  // Replaces Actlet's base prompt when set.
  string base_prompt = 12;
  // Notes on what is installed in the container and how to use it, added
  // to the agent's prompt along with any manifest in the image.
  string tools_manifest = 13;
  // How many model turns pass between execution checkpoints. 0 means
  // every turn.
  uint32 checkpoint_every_turns = 14;
  // What a viewer attached to the box itself, such as the local TUI, may
  // do.
  LocalAttach local_attach = 15;
}

// LocalAttach controls viewers attached to the box itself. The
// orchestrator's commands always take precedence.
message LocalAttach {
  // Commands a local viewer may send: "steer", "pause" and "stop". Empty
  // allows steer notes only; ["none"] allows nothing.
  repeated string commands = 1;
  // No local attach at all.
  bool disabled = 2;
}

// Budget limits the session's use of one resource, over all its runs:
// TIME counts active run time, MONEY the cost the gateway reports with
// model and bridged tool calls, TOKENS the models' input and output
// tokens, and DISK the session folder's size.
message Budget {
  BudgetKind kind = 1;
  // The limit in the kind's unit: seconds for TIME, currency units for
  // MONEY, tokens for TOKENS, bytes for DISK.
  double limit = 2;
  // ISO 4217 currency code, for MONEY budgets.
  string currency = 3;
  // Report when this percentage of the limit is used; 0 for never.
  uint32 alert_at_percent = 4;
  // What happens when the limit is reached.
  BudgetAction on_exhaust = 5;
  // How to wait, when on_exhaust is WAIT.
  BudgetWaitMode wait_mode = 6;
}

enum BudgetKind {
  BUDGET_KIND_UNSPECIFIED = 0;
  BUDGET_KIND_TIME = 1;
  BUDGET_KIND_MONEY = 2;
  BUDGET_KIND_TOKENS = 3;
  BUDGET_KIND_DISK = 4;
}

enum BudgetAction {
  BUDGET_ACTION_UNSPECIFIED = 0;
  // End the task.
  BUDGET_ACTION_KILL = 1;
  // Wait until the budget is reset.
  BUDGET_ACTION_WAIT = 2;
}

enum BudgetWaitMode {
  BUDGET_WAIT_MODE_UNSPECIFIED = 0;
  // Pause the session: persist and exit.
  BUDGET_WAIT_MODE_PAUSE = 1;
  // Stay running but start no new work.
  BUDGET_WAIT_MODE_IDLE = 2;
}

// ModelCatalog names the models a session may use by alias: a real model
// name or a tier such as "large" or "fast", resolved by the orchestrator.
message ModelCatalog {
  repeated ModelAlias aliases = 1;
  // Which alias each role uses, for example "main", "subagent" or "llm".
  map<string, string> roles = 2;
  // The aliases the agent may choose itself for a call, such as a cheaper
  // model for a subagent's bulk work.
  repeated string selectable = 3;
}

message ModelAlias {
  string alias = 1;
  string description = 2;
  repeated string capabilities = 3;
  // The model's context window in tokens, when known.
  uint64 context_window = 4;
}

// ToolGrant allows the session to use a tool.
message ToolGrant {
  string name = 1;
  // Tool-specific settings.
  map<string, string> settings = 2;
}

message Limits {
  // Workers (the agent and its subagents) running at once.
  uint32 max_workers = 1;
  // Tool calls of one model turn running at once.
  uint32 max_tool_concurrency = 2;
  // How deep subagents may nest: 1 lets the agent spawn subagents that
  // can't spawn their own. 0 means the worker's default.
  uint32 max_subagent_depth = 3;
  // Subagents a session may create in all. 0 means the worker's default.
  uint32 max_subagents = 4;
}

enum DisconnectBehavior {
  DISCONNECT_BEHAVIOR_UNSPECIFIED = 0;
  // Keep doing local work while disconnected (the default).
  DISCONNECT_BEHAVIOR_CONTINUE_LOCAL = 1;
}

// Task describes the work for a session. It mirrors the task.json file in
// the session folder.
message Task {
  // Version of the task document schema: "v0".
  string schema = 1;
  string id = 2;
  // What kind of task this is; it decides how definition and input are read.
  string kind = 3;
  // What to do: a UTF-8 JSON document whose schema depends on kind.
  bytes definition = 4;
  // The task input: a UTF-8 JSON document whose schema depends on kind.
  bytes input = 5;
}

// --- Control ---

message ControlUp {
  oneof msg {
    ControlHello hello = 1;
    CommandAck ack = 2;
    Status status = 3;
    FileResponse file = 4;
  }
}

message ControlHello {
  string session_id = 1;
  uint64 epoch = 2;
  SessionState state = 3;
}

message ControlDown {
  oneof msg {
    Command command = 1;
    Heartbeat heartbeat = 2;
    FileRequest read_file = 3;
  }
}

// FileRequest asks the worker for a file of the session folder, for a
// viewer attached through the orchestrator. It isn't a command: the worker
// doesn't record it, and the gateway doesn't send it again after a
// reconnect. Workers that announce the "attach.files" capability answer
// with a FileResponse of the same ID, serving only files in inputs/,
// workspace/ and output/, never through symbolic links out of them, and
// cutting large files short.
message FileRequest {
  string id = 1;
  // The path as tools show it: relative to workspace/, such as
  // "report.md" or "../output/report.md".
  string path = 2;
}

message FileResponse {
  string id = 1;
  // The path relative to the session folder, such as "output/report.md".
  string path = 2;
  // The start of the file, up to the worker's limit.
  bytes content = 3;
  int64 size = 4;
  bool truncated = 5;
  // The file holds binary data, which isn't returned.
  bool binary = 6;
  // Why the file couldn't be read: a gRPC status code, and a message.
  // Zero means it was read.
  int32 error_code = 7;
  string error = 8;
}

// Heartbeat keeps an idle control stream busy in the gateway-to-worker
// direction, so that proxies with read timeouts, such as NGINX's
// grpc_read_timeout, don't cut it. Workers ignore it.
message Heartbeat {
  google.protobuf.Timestamp time = 1;
}

// Command is an instruction to the worker. The worker records every command
// durably before acknowledging it, and acknowledges a repeated ID again
// without applying it twice, so commands can be resent safely.
message Command {
  // Unique per session, chosen by the sender.
  string id = 1;
  Origin origin = 2;
  // Who issued the command, e.g. an operator name. Informational.
  string actor = 3;
  oneof action {
    Pause pause = 10;
    Stop stop = 11;
    Steer steer = 12;
    ProfileUpdate profile_update = 13;
  }
}

enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_ORCHESTRATOR = 1;
  // A viewer on the box's machine, over the session folder's socket.
  ORIGIN_LOCAL = 2;
  // A viewer elsewhere: attached through the orchestrator, or to the box's
  // attach port.
  ORIGIN_REMOTE = 3;
}

// Pause: stop starting new work, persist, and exit the process. The session
// resumes when a worker is started again on the same session folder.
message Pause {
  // Required: a pause without a mode is rejected.
  PauseMode mode = 1;
}

enum PauseMode {
  PAUSE_MODE_UNSPECIFIED = 0;
  // Let running work finish, then pause.
  PAUSE_MODE_DRAIN = 1;
  // Signal running work to stop, record what happened, then pause.
  PAUSE_MODE_INTERRUPT = 2;
}

// Stop: cancel the task, persist, and exit. A stopped session doesn't
// resume.
message Stop {
  // How long running work gets after being signalled before it is killed.
  // Unset means the profile's stop_grace.
  google.protobuf.Duration grace = 1;
  // Kill running work immediately, ignoring grace.
  bool kill = 2;
}

// Steer passes an operator note to the session.
message Steer {
  string note = 1;
}

// ProfileUpdate changes some of the profile's fields mid-session. Only
// these may change: limits.max_workers, limits.max_tool_concurrency,
// limits.max_subagents, budgets and local_attach. A command naming any
// other field is rejected as a whole. The worker records the new
// configuration before it takes effect.
message ProfileUpdate {
  // The new values, in a profile; only the fields named are read.
  Profile profile = 1;
  // The fields to change, such as "limits.max_workers" or "budgets".
  repeated string fields = 2;
  // Budgets whose usage starts again from zero, such as at the start of a
  // new billing period.
  repeated BudgetKind reset_budgets = 3;
}

message CommandAck {
  string command_id = 1;
  CommandResult result = 2;
  // Why a command was rejected, or other detail.
  string message = 3;
  // The command was already applied earlier; it wasn't applied again.
  bool duplicate = 4;
  SessionState state = 5;
}

enum CommandResult {
  COMMAND_RESULT_UNSPECIFIED = 0;
  COMMAND_RESULT_ACCEPTED = 1;
  COMMAND_RESULT_REJECTED = 2;
}

message Status {
  SessionState state = 1;
  google.protobuf.Timestamp time = 2;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_RUNNING = 1;
  // Finishing or interrupting work before exiting paused.
  SESSION_STATE_PAUSING = 2;
  // Cancelling work before exiting stopped.
  SESSION_STATE_STOPPING = 3;
  // Terminal states, reported in the last status before the worker exits.
  SESSION_STATE_PAUSED = 4;
  SESSION_STATE_STOPPED = 5;
  SESSION_STATE_COMPLETED = 6;
  SESSION_STATE_FAILED = 7;
}

// --- Activity ---

message ActivityUp {
  oneof msg {
    ActivityHello hello = 1;
    ActivityBatch batch = 2;
  }
}

message ActivityHello {
  string session_id = 1;
  // The epoch whose events this stream carries.
  uint64 epoch = 2;
}

message ActivityBatch {
  // Events in sequence order, all of the stream's epoch.
  repeated ActivityEvent events = 1;
}

// ActivityAck reports the highest sequence number up to which the gateway
// holds every event of the epoch. The worker resends anything after it.
message ActivityAck {
  uint64 epoch = 1;
  uint64 acked_seq = 2;
}

// ActivityEvent is one semantic event. Sequence numbers start at 1 in each
// epoch and have no gaps; events the worker had to drop are summarised by a
// Gap event instead.
message ActivityEvent {
  // Unique within the session: "<epoch>.<seq>".
  string id = 1;
  uint64 epoch = 2;
  uint64 seq = 3;
  google.protobuf.Timestamp time = 4;
  // The worker the event is about: "root" for the session's agent,
  // "root.1" for its first subagent, and so on. Empty for the session
  // itself.
  string worker = 5;
  oneof body {
    SessionStarted started = 10;
    StateChange state = 11;
    CommandReceived command = 12;
    SteerNote steer = 13;
    Text text = 14;
    Gap gap = 15;
    ModelTurn model_turn = 16;
    ToolStarted tool_started = 17;
    ToolFinished tool_finished = 18;
    FileChange file_change = 19;
    SubagentSpawned subagent_spawned = 20;
    SubagentFinished subagent_finished = 21;
    SessionInfo session_info = 22;
    Progress progress = 23;
    Feedback feedback = 24;
    BudgetStatus budget_status = 25;
  }
}

// SessionInfo describes a run once, at its start, for viewers: its task,
// effective configuration and tools.
message SessionInfo {
  string task_id = 1;
  string task_kind = 2;
  // task.json, possibly cut short.
  string task = 3;
  // The run's effective configuration, as JSON.
  string config = 4;
  repeated Budget budgets = 5;
  ModelCatalog models = 6;
  // The tools the agent has, and the profile's grants.
  repeated ToolInfo tools = 7;
  repeated ToolGrant grants = 8;
  // What is installed, from the tools manifests, possibly cut short.
  string tools_manifest = 9;
  string worker_id = 10;
  string actlet_version = 11;
  // Commands a local viewer may send.
  repeated string local_commands = 12;
}

message ToolInfo {
  string name = 1;
  // What recovery does with an interrupted call: "retry", "reconcile",
  // "never" or "spawn".
  string policy = 2;
  string description = 3;
}

message SessionStarted {
  uint64 epoch = 1;
  string profile_id = 2;
  string profile_version = 3;
  // This start resumed or recovered an existing session.
  bool resumed = 4;
}

message StateChange {
  SessionState from = 1;
  SessionState to = 2;
  string reason = 3;
}

message CommandReceived {
  Command command = 1;
  CommandResult result = 2;
  string message = 3;
}

message SteerNote {
  string note = 1;
  Origin origin = 2;
  string actor = 3;
}

// Text is a display-only line of output.
message Text {
  string text = 1;
}

// Gap marks events the worker dropped because its local buffers were full.
message Gap {
  uint64 dropped = 1;
  google.protobuf.Timestamp first = 2;
  google.protobuf.Timestamp last = 3;
}

// ModelTurn is one completed model call of the agent.
message ModelTurn {
  uint64 turn = 1;
  string model = 2;
  // The model's text, possibly cut short.
  string text = 3;
  // Names of the tools the model called.
  repeated string tool_calls = 4;
  StopReason stop_reason = 5;
  Usage usage = 6;
}

// ToolStarted is a tool call the agent is starting.
message ToolStarted {
  string call_id = 1;
  string tool = 2;
  // The call's JSON input, possibly cut short.
  string input = 3;
}

// ToolFinished is the result of a tool call.
message ToolFinished {
  string call_id = 1;
  string tool = 2;
  bool is_error = 3;
  // The outcome is unknown: the worker stopped while the call ran.
  bool outcome_unknown = 4;
  // What the model is told, possibly cut short.
  string output = 5;
  google.protobuf.Duration took = 6;
  // What a call through the gateway used, such as an llm call.
  Usage usage = 7;
}

// FileChange is a file a tool changed.
message FileChange {
  string call_id = 1;
  // Relative to the workspace when inside it.
  string path = 2;
  bool created = 3;
  // A unified diff, possibly cut short.
  string diff = 4;
}

// SubagentSpawned is a subagent starting; the event's worker is the new
// subagent.
message SubagentSpawned {
  string parent = 1;
  // The subtask, possibly cut short.
  string task = 2;
  string model = 3;
  // The parent's spawn_subagent call that waits for it.
  string call_id = 4;
}

// SubagentFinished is a subagent ending; its result goes back to its
// parent.
message SubagentFinished {
  bool is_error = 1;
  // The result, possibly cut short.
  string result = 2;
  uint64 turns = 3;
}

// Progress is the agent reporting how its task is going, with the
// report_progress tool.
message Progress {
  string message = 1;
  // How far along it is, from 0 to 100; unset when it doesn't say.
  optional uint32 percent = 2;
}

// Feedback is the agent telling the orchestrator something about the
// task or its setup, with the send_feedback tool.
message Feedback {
  // "problem", "suggestion", "question" or "other".
  string kind = 1;
  string message = 2;
}

// BudgetStatus reports the session's budgets: at the start of a run, when
// a budget reaches its alert threshold or its limit, and when a limit
// changes or a budget is reset.
message BudgetStatus {
  repeated BudgetUsage budgets = 1;
  // Why it was sent: "start", "alert", "exhausted", "update" or "reset".
  string reason = 2;
}

message BudgetUsage {
  BudgetKind kind = 1;
  double limit = 2;
  double used = 3;
  string currency = 4;
  // "ok", "alerted" (past the alert threshold), "exhausted", or
  // "waiting" (exhausted, and work waits for the budget to be raised).
  string state = 5;
}

// --- Inference ---

// InferenceRequest is one model call. The conversation is provider
// neutral; the continuation carries whatever provider state the gateway
// needs between calls.
message InferenceRequest {
  string session_id = 1;
  uint64 epoch = 2;
  // Identifies the call. The worker records it before calling and sends
  // the same ID when it retries the call, also after a crash, so the
  // gateway can use it as an idempotency key: a call with an ID the
  // gateway has already answered should get the same answer.
  string intent_id = 3;
  // The model alias from the profile's catalogue.
  string model = 4;
  string system = 5;
  repeated Message messages = 6;
  repeated ToolSpec tools = 7;
  // The continuation of the previous response in this conversation,
  // passed back unchanged. The worker never interprets it.
  bytes continuation = 8;
  // 0 lets the gateway choose.
  uint32 max_output_tokens = 9;
  // Why the model is called: "agent" for a worker's turn, "llm" for the
  // agent's llm tool, a one-off call with no tools.
  string purpose = 10;
  // The worker making the call: "root", "root.1", and so on.
  string worker = 11;
}

message Message {
  Role role = 1;
  repeated Part parts = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ASSISTANT = 2;
}

message Part {
  oneof part {
    string text = 1;
    ToolCall tool_call = 2;
    ToolResult tool_result = 3;
  }
}

// ToolCall is the model asking to run a tool.
message ToolCall {
  // Unique within the conversation; chosen by the model's provider.
  string id = 1;
  string name = 2;
  // The input, a JSON object.
  string input = 3;
}

// ToolResult answers a ToolCall, in a user message.
message ToolResult {
  string call_id = 1;
  string content = 2;
  bool is_error = 3;
}

// ToolSpec describes a tool the model may call.
message ToolSpec {
  string name = 1;
  string description = 2;
  // The JSON schema of the tool's input.
  string input_schema = 3;
}

// InferenceResponse streams the answer: text deltas and complete tool
// calls in the order the model produced them, then Done.
message InferenceResponse {
  oneof msg {
    string text_delta = 1;
    ToolCall tool_call = 2;
    InferenceDone done = 3;
  }
}

message InferenceDone {
  StopReason stop_reason = 1;
  Usage usage = 2;
  // Passed back with the next request of the conversation.
  bytes continuation = 3;
  // The gateway answered from an earlier call with the same intent ID.
  bool replayed = 4;
}

enum StopReason {
  STOP_REASON_UNSPECIFIED = 0;
  // The model finished its answer.
  STOP_REASON_END_TURN = 1;
  // The model wants tool results.
  STOP_REASON_TOOL_USE = 2;
  STOP_REASON_MAX_TOKENS = 3;
  STOP_REASON_REFUSAL = 4;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cache_read_tokens = 3;
  uint64 cache_write_tokens = 4;
  // What the call cost, in currency, when the gateway knows.
  double cost = 5;
  string currency = 6;
}

// --- Bridged tools ---

// ToolCallRequest is one call of a bridged tool.
message ToolCallRequest {
  string session_id = 1;
  uint64 epoch = 2;
  // Identifies the call. The worker records it before calling and sends
  // the same ID when it asks again, also after a crash, a pause or a
  // restart, so the gateway can answer a call once: a call with an ID it
  // has answered should get the same answer.
  string intent_id = 3;
  // The worker making the call: "root", "root.1", and so on.
  string worker = 4;
  // The tool, such as "decide".
  string tool = 5;
  // The input, a JSON object.
  string input = 6;
}

message ToolCallResponse {
  // The result, a JSON object.
  string output = 1;
  // The tool failed; output says why.
  bool is_error = 2;
  // What the call used, such as tokens and cost, when it used a model.
  Usage usage = 3;
  // The gateway answered from an earlier call with the same intent ID.
  bool replayed = 4;
}
